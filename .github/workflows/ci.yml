name: DevOS CI

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and VM test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential ca-certificates curl python3 qemu-system-x86 \
            tar xorriso

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Run host and QEMU regression suite
        run: make test-vm

      - name: Verify repeatable ISO packaging
        run: |
          first="$(sha256sum build/devos.iso | cut -d ' ' -f 1)"
          make iso
          second="$(sha256sum build/devos.iso | cut -d ' ' -f 1)"
          test "$first" = "$second"

      - name: Create ISO checksum
        run: sha256sum build/devos.iso > build/devos.iso.sha256

      - name: Save tested ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: devos-iso-${{ github.sha }}
          path: |
            build/devos.iso
            build/devos.iso.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: devos-iso-${{ github.sha }}
          path: build

      - name: Attach tested ISO and checksum to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/devos.iso build/devos.iso.sha256
